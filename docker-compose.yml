
# Development and demo stack.
#
# docker compose up -d --build
# Open http://localhost:8000
#
# Traffic routing:
# Requests -> app:8000 -> toxiproxy:15432 -> postgres:5432
#                    -> toxiproxy:16379 -> redis:6379
#
# INTENTIONAL FAILURE DEMO:
# DB_TIMEOUT_SECONDS is increased from 1 to 10 seconds
# to test whether GitHub Actions detects a resilience regression.

name: resilience-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    command:
      - "-host=0.0.0.0"
      - "-config=/config/toxiproxy.json"
    configs:
      - source: toxiproxy-proxies
        target: /config/toxiproxy.json
    ports:
      - "127.0.0.1:8474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
      args:
        APP_VERSION: ${APP_VERSION:-local}

    image: ${APP_IMAGE:-catalog-api:local}

    environment:
      DB_HOST: toxiproxy
      DB_PORT: "15432"
      DB_NAME: catalog
      DB_USER: catalog
      DB_PASSWORD: catalog

      REDIS_HOST: toxiproxy
      REDIS_PORT: "16379"

      # Demo-friendly circuit breaker settings
      CB_RESET_TIMEOUT_SECONDS: "5"
      CACHE_FRESH_SECONDS: "10"

      # ==========================================
      # INTENTIONAL RESILIENCE REGRESSION
      # Original database timeout: 1 second
      # Modified database timeout: 10 seconds
      # Expected to fail the slow-database test
      # ==========================================
      DB_TIMEOUT_SECONDS: "10"

    ports:
      - "8000:8000"

    depends_on:
      toxiproxy:
        condition: service_healthy

configs:
  toxiproxy-proxies:
    content: |
      [
        {
          "name": "postgres",
          "listen": "0.0.0.0:15432",
          "upstream": "postgres:5432",
          "enabled": true
        },
        {
          "name": "redis",
          "listen": "0.0.0.0:16379",
          "upstream": "redis:6379",
          "enabled": true
        }
      ]

volumes:
  pgdata:
